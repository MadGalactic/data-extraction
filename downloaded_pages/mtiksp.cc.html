<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiktok Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #000, #333);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            width: 150px;
            margin: 20px 0;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Tiktok Shop Logo" class="logo">
        <h1 id="title">Welcome to Tiktok Shop</h1>
        <p id="description">Please use your mobile device to access this page for the best experience.</p>
        <div id="qrcode"></div>
        <p id="scan-text">Scan the QR code to visit the mobile page:</p>
    </div>
    <footer>
        &copy; 2024 Tiktok Shop | All Rights Reserved
    </footer>
    <script>
        // æ£æµæ¯å¦ä¸ºç§»å¨è®¾å¤
        function isMobileDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent.toLowerCase());
        }

        // ç§»å¨è®¾å¤èªå¨è·³è½¬å° /wap
        function redirectIfMobile() {
            if (isMobileDevice()) {
                const url = new URL(window.location.href);
                const mobileUrl = `${url.origin}/wap`;
                window.location.href = mobileUrl; // è·³è½¬å° /wap
            }
        }

        // çæäºç»´ç 
        function generateQRCode() {
            const url = new URL(window.location.href);
            const mobileUrl = `${url.origin}/wap`; // äºç»´ç åå®¹æå /wap
            const qrCodeElement = document.getElementById('qrcode');
            new QRCode(qrCodeElement, {
                text: mobileUrl,
                width: 150,
                height: 150,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // åå§åé»è¾
        document.addEventListener("DOMContentLoaded", () => {
            redirectIfMobile(); // æ£æµæ¯å¦æ¯ææºç«¯å¹¶è·³è½¬
            generateQRCode(); // çæäºç»´ç 
        });
    </script>
</body>
</html>
